  # ── Tasks ──────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks (filtered by role/assignment)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - in: query
          name: assigneeId
          schema:
            type: string
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create and assign a task (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/overdue:
    get:
      operationId: listOverdueTasks
      tags: [tasks]
      summary: List all overdue tasks
      responses:
        "200":
          description: Overdue tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete (with optional delay log)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          description: Delay reason required

  # ── Delay Logs ─────────────────────────────────────────────────────────────
  /tasks/{id}/delay-log:
    post:
      operationId: createDelayLog
      tags: [delay-logs]
      summary: Submit a delay reason for an overdue task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelayLogInput"
      responses:
        "201":
          description: Delay log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelayLog"

  # ── Consultations ──────────────────────────────────────────────────────────
  /consultations:
    get:
      operationId: listConsultations
      tags: [consultations]
      summary: List consultations
      parameters:
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of consultations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultation"
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Create a consultation record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  /consultations/{id}:
    get:
      operationId: getConsultation
      tags: [consultations]
      summary: Get a consultation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consultation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
    patch:
      operationId: updateConsultation
      tags: [consultations]
      summary: Update a consultation (add transcript, audio URL, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationUpdate"
      responses:
        "200":
          description: Updated consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  # ── KPI Dashboard ──────────────────────────────────────────────────────────
  /kpi/dashboard:
    get:
      operationId: getKpiDashboard
      tags: [kpi]
      summary: KPI dashboard summary (admin only)
      responses:
        "200":
          description: KPI metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDashboard"

  /kpi/sla-report:
    get:
      operationId: getSlaReport
      tags: [kpi]
      summary: SLA adherence report by time period (admin only)
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, quarter]
            default: month
      responses:
        "200":
          description: SLA report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaReportEntry"

  # ── Dashboard Summary (wow) ────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [kpi]
      summary: High-level dashboard counts and pipeline summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Invites ────────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResult"
  /devices:
    post:
      operationId: registerDevice
      tags: [notifications]
      summary: Register this device for push notifications
      description: >
        Registers an FCM token against the caller's ACTIVE workspace. The
        workspace is taken from the session, never from the body, so a device
        cannot be registered against a chamber the caller does not belong to.

        Upserts on (workspace, token): the OS reissues the token on reinstall
        and on restore to a new handset, so the app re-registers every launch
        and this must update rather than accumulate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDevice"
  /devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [notifications]
      summary: Stop sending notifications to this device
      description: >
        Revoked rather than deleted, so "notifications were switched off" stays
        answerable afterwards.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
  /document-requests:
    get:
      operationId: listDocumentRequests
      tags: [document-requests]
      summary: List document requests (staff sees all; clients see their own)
      responses:
        "200":
          description: List of document requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRequest"
    post:
      operationId: createDocumentRequest
      tags: [document-requests]
      summary: Create a document request for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestInput"
      responses:
        "201":
          description: Created document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /document-requests/{id}:
    patch:
      operationId: updateDocumentRequest
      tags: [document-requests]
      summary: Update document request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestUpdate"
      responses:
        "200":
          description: Updated document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across cases, tasks, consultations, clients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grouped search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List pending invites (admin only)
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Generate an invite link for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /beta-feedback:
    post:
      operationId: sendBetaFeedback
      tags: [feedback]
      summary: Send product feedback from the beta widget
      description: >
        Records a free-text note against the page the user was on. Distinct from
        /feedback, which is a client rating a matter. Requires sign-in but not a
        workspace — the people most worth hearing from are often the ones stuck
        outside one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaFeedbackInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaFeedbackAck"
        "400":
          description: Invalid
        "401":
          description: Unauthorized

  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time]
      summary: Time logged, optionally for one matter
      parameters:
        - in: query
          name: caseId
          schema: { type: integer }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeEntry" }
        "403": { description: Forbidden }
    post:
      operationId: createTimeEntry
      tags: [time]
      summary: Log time against a matter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryInput" }
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
        "400": { description: Invalid }
        "403": { description: Forbidden }

  /time-entries/{id}:
    delete:
      operationId: deleteTimeEntry
      tags: [time]
      summary: Delete an entry you logged
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /time-entries/timer:
    get:
      operationId: getRunningTimer
      tags: [time]
      summary: The caller's running timer, if any
      responses:
        "200":
          description: Running timer or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunningTimer" }
        "403": { description: Forbidden }
    post:
      operationId: startTimer
      tags: [time]
      summary: Start a timer on a matter
      description: >
        One timer per person. Starting a second stops the first and banks its
        minutes, because the alternative is silently double-counting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimerStartInput" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunningTimer" }
        "400": { description: Invalid }
        "403": { description: Forbidden }
    delete:
      operationId: stopTimer
      tags: [time]
      summary: Stop the running timer and bank the minutes
      responses:
        "200":
          description: The finished entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
        "404": { description: No timer running }

  /kpi/performance:
    get:
      operationId: getChamberPerformance
      tags: [kpi]
      summary: Chamber performance on time and effort (admin only)
      description: >
        Every figure is aggregated in SQL over the requested window, with the
        immediately preceding window of equal length as the comparison. Metrics
        below their sample threshold report the count and a null value rather
        than a number drawn through too few points.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            {
              type: string,
              pattern: "^\\d{4}-\\d{2}-\\d{2}$",
              description: "Calendar date, YYYY-MM-DD.",
            }
        - in: query
          name: to
          required: true
          schema:
            {
              type: string,
              pattern: "^\\d{4}-\\d{2}-\\d{2}$",
              description: "Calendar date, YYYY-MM-DD.",
            }
      responses:
        "200":
          description: Performance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChamberPerformance" }
        "400": { description: Invalid range }
        "403": { description: Forbidden }

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: Invoices, with filters and period totals (admin only)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: clientId, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
        - { in: query, name: to, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
      responses:
        "200":
          description: Invoices and totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceList" }
        "403": { description: Forbidden }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a draft invoice
      description: >
        Always a DRAFT. No number is assigned here — numbers are handed out at
        issue, which is what keeps the series gapless when drafts are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { description: Invalid }
        "403": { description: Forbidden }

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: One invoice with its lines
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Not found }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Edit a draft
      description: Drafts only. An issued invoice is refused with 409.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { description: Not a draft }
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete a draft
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "409": { description: Not a draft }

  /invoices/{id}/issue:
    post:
      operationId: issueInvoice
      tags: [invoices]
      summary: Issue a draft — assigns the number, snapshots both parties
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { description: Not a draft }
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }

  /invoices/{id}/status:
    post:
      operationId: setInvoiceStatus
      tags: [invoices]
      summary: Move an issued invoice to sent, paid or void
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { description: Transition not allowed }

  /invoices/{id}/pdf:
    get:
      operationId: getInvoicePdf
      tags: [invoices]
      summary: The invoice as a PDF, rendered server-side
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Not found }

  /invoices/unbilled:
    get:
      operationId: listUnbilledTime
      tags: [invoices]
      summary: Billable time not yet on any invoice
      parameters:
        - { in: query, name: clientId, schema: { type: integer } }
        - { in: query, name: caseId, schema: { type: integer } }
      responses:
        "200":
          description: Unbilled entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnbilledEntry" }
        "403": { description: Forbidden }

  /billing-settings:
    get:
      operationId: getBillingSettings
      tags: [invoices]
      summary: The chamber's billing identity and tax defaults
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSettings" }
        "403": { description: Forbidden }
    patch:
      operationId: updateBillingSettings
      tags: [invoices]
      summary: Set the chamber's billing identity and tax defaults
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingSettings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSettings" }
        "403": { description: Forbidden }

  /operator/metrics:
    get:
      operationId: getOperatorMetrics
      tags: [operator]
      summary: The platform across every chamber — operator only
      description: >
        The one endpoint that reads across tenants. Not gated by a capability:
        capabilities are granted per membership by chamber admins, so any
        capability would be one invite away for anyone who founds a chamber.
        Gated instead on the OPERATOR_EMAILS allowlist, which only whoever can
        deploy is able to change. Unset means the route does not exist.


        Refuses with 404 rather than 403, so a caller who is not an operator
        cannot tell a cross-tenant surface is here at all.


        Counts only. No matter titles, no client names, no email addresses —
        a chamber's data belongs to its chamber, and the DPA says so.
      responses:
        "200":
          description: Every metric, one round trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorMetrics" }
        "404":
          description: Not an operator, or the operator view is not configured

components:
  schemas:
    OperatorMetrics:
      type: object
      required: [generatedAt, users, chambers, trial, revenue, plans, signups, chamberRows]
      properties:
        generatedAt:
          type: string
        users:
          type: object
          required: [total, seen24h, seen7d, seen30d, neverSeen, returning, lapsed]
          properties:
            total: { type: integer }
            seen24h: { type: integer }
            seen7d: { type: integer }
            seen30d: { type: integer }
            neverSeen:
              type: integer
              description: >
                Not seen since last_seen_at shipped. NOT the same as never
                having signed in — the column has no backfill and cannot have
                one.
            returning:
              type: integer
              description: Registered over a week ago and back within the last week.
            lapsed:
              type: integer
              description: Registered over a week ago and not seen since.
        chambers:
          type: object
          required: [total, withMatters, empty]
          properties:
            total: { type: integer }
            withMatters: { type: integer }
            empty:
              type: integer
              description: Founded and never opened a matter. The onboarding number.
        trial:
          type: object
          required: [bought, converted, expiredUnconverted, stillInTrial]
          properties:
            bought: { type: integer }
            converted:
              type: integer
              description: Took the trial and is now on another plan.
            expiredUnconverted:
              type: integer
              description: Took the trial, still on it, period has run out.
            stillInTrial: { type: integer }
        revenue:
          type: object
          required: [allTimeMinor, last30dMinor, payments]
          properties:
            allTimeMinor:
              type: integer
              description: Integer paise, like every other _minor value.
            last30dMinor: { type: integer }
            payments: { type: integer }
        plans:
          type: array
          items:
            type: object
            required: [plan, status, chambers]
            properties:
              plan: { type: string }
              status: { type: string }
              chambers: { type: integer }
        signups:
          type: array
          description: Chambers founded per week, last twelve weeks.
          items:
            type: object
            required: [week, chambers]
            properties:
              week:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
              chambers: { type: integer }
        chamberRows:
          type: array
          description: >
            Newest 200 chambers. Counts and plan state only — never the content
            of a matter, and never anybody's address.
          items:
            type: object
            required: [id, name, createdAt, plan, status, seats, matters]
            properties:
              id: { type: integer }
              name: { type: string }
              createdAt:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
              plan: { type: string }
              status: { type: string }
              periodEnd:
                type: string
                nullable: true
              seats: { type: integer }
              matters: { type: integer }
              lastSeen:
                type: string
                nullable: true
                description: Most recent sign of life from anyone in the chamber.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── User ──────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, roleSelected, displayName, email, phone, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, clerk, client]
        roleSelected:
          type: boolean
          description: True once the user has completed self-service role selection at sign-up.
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Verified mobile in E.164, or "".
        authProvider:
          type: ["string", "null"]
        barCouncilState:
          type: ["string", "null"]
        barEnrolmentNo:
          type: ["string", "null"]
        aorNo:
          type: ["string", "null"]
        barDeclaredAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string

    # ── Session & workspaces ──────────────────────────────────────────────
    Workspace:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [chamber, client_portal]

    WorkspaceMembershipSummary:
      type: object
      required: [workspace, role, status]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        status:
          type: string
          enum: [pending, active, revoked]
        isOwner:
          type: boolean
        requestedRole:
          type: ["string", "null"]

    SessionClaims:
      type: object
      required:
        [
          userId,
          clerkId,
          displayName,
          email,
          phone,
          accessStatus,
          memberships,
          capabilities,
          isOwner,
          profileComplete,
        ]
      properties:
        userId:
          type: integer
        clerkId:
          type: string
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
          description: >
            Verified mobile in E.164, or "". Somebody who signed up by SMS has
            this and no email; the two are alternatives, not a pair.
        accessStatus:
          type: string
          enum: [not_recognised, pending_approval, active]
          description: >
            active   — holds at least one ACTIVE membership.
            pending_approval — has asked for access and is awaiting a decision.
            not_recognised — signed in successfully, but the verified email is on
            no workspace access list and no request is outstanding. Reaches
            nothing; the sign-in layer shows an error naming the address.
        authProvider:
          type: ["string", "null"]
          description: How the caller signed in (google | zoho | email). Display only.
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembershipSummary"
        activeWorkspace:
          oneOf:
            - $ref: "#/components/schemas/Workspace"
            - type: "null"
        role:
          type: ["string", "null"]
          description: Role in the active workspace, resolved from the membership row.
        displayRole:
          type: ["string", "null"]
        isOwner:
          type: boolean
          description: True when the caller founded the active workspace.
        capabilities:
          type: array
          description: Server-resolved capability list. The UI renders from this and nothing else.
          items:
            type: string
        workspaceToken:
          type: ["string", "null"]
          description: Scoped token for the active workspace, minted after membership was verified.
        profileComplete:
          type: boolean
          description: >
            False when the role on the active workspace requires bar
            registration (admin, senior_advocate, junior_advocate) and the
            caller has not declared it. True for every other role, and true
            when there is no active workspace yet — those states are gated
            elsewhere. Drives a full-screen gate client-side; the server also
            enforces it directly, since a client-only gate is bypassable.

    BarRegistrationInput:
      type: object
      required: [barCouncilState, barEnrolmentNo]
      properties:
        barCouncilState:
          type: string
          minLength: 1
          description: >
            Self-declared, loosely validated — enrolment formats vary by
            state bar and are not standardised. What is typed is stored.
        barEnrolmentNo:
          type: string
          minLength: 1
        aorNo:
          type: string
          description: Supreme Court Advocate-on-Record number. Optional — most advocates never hold one.

    BarRegistration:
      type: object
      required: [barCouncilState, barEnrolmentNo, barDeclaredAt]
      properties:
        barCouncilState:
          type: string
        barEnrolmentNo:
          type: string
        aorNo:
          type: ["string", "null"]
        barDeclaredAt:
          type: string
          format: date-time

    WorkspaceSwitchInput:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: integer

    AccessRequest:
      type: object
      required: [id, workspaceId, userId, clerkId, role, status, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        workspaceName:
          type: ["string", "null"]
        userId:
          type: integer
        clerkId:
          type: string
        displayName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
        requestedRole:
          type: ["string", "null"]
        requestNote:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, revoked]
        decidedBy:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccessRequestInput:
      type: object
      required: [workspaceSlug]
      properties:
        workspaceSlug:
          type: string
          description: The workspace being applied to.
        requestedRole:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: Intent only. Never granted automatically.
        note:
          type: string

    AccessDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: >
            The role the admin grants. Required on approve. Deliberately separate
            from requestedRole — an applicant asking for admin does not get it.

    WorkspaceCreateInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 2
          description: The chamber's name, e.g. "Raghavan Chambers".
        role:
          type: string
          enum: [admin, senior_advocate]
          description: >
            The founder's own role. Restricted to these two — a chamber must be
            created by someone who will run it.

    CalendarEntry:
      type: object
      required: [id, workspaceId, title, kind, entryDate, audience, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
        entryDate:
          type: string
        entryTime:
          type: ["string", "null"]
        caseId:
          type: ["integer", "null"]
        caseTitle:
          type: ["string", "null"]
        audience:
          type: string
        audienceLabel:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        createdByRole:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CalendarEntryInput:
      type: object
      required: [title, entryDate]
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
          default: note
        entryDate:
          type: string
          description: YYYY-MM-DD
        entryTime:
          type: string
        caseId:
          type: integer
        audience:
          type: string
          default: all
          description: "all | staff | role:<role> | user:<clerkId>"

    CalendarEntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
        entryDate:
          type: string
        entryTime:
          type: string
        caseId:
          type: integer
        audience:
          type: string

    AccessListEntry:
      type: object
      required: [id, workspaceId, kind, value, role, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        kind:
          type: string
          enum: [email, domain, phone]
        value:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        caseId:
          type: ["integer", "null"]
          description: Set only when role is "client". Copied onto the membership on first sign-in.
        note:
          type: ["string", "null"]
        addedBy:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccessListEntryInput:
      type: object
      required: [kind, value, role]
      properties:
        kind:
          type: string
          enum: [email, domain, phone]
        value:
          type: string
          minLength: 3
          description: >
            An exact email address, a bare domain such as "chambers.in", or a
            mobile number in E.164 ("+919876543210"). A ten-digit number is
            read as Indian. There is deliberately no domain equivalent for
            phone — a numbering range is not an organisation.
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: The role granted on first sign-in. Chosen by the admin.
        caseId:
          type: integer
          description: >
            Required when role is "client" — the server rejects a client
            entry with no caseId, and rejects a caseId on any other role.
            Same rule as InviteInput.caseId; this is the other of the two
            paths that can create a client membership.
        note:
          type: string

    MembershipUpdateInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        status:
          type: string
          enum: [active, revoked]

    UserRoleUpdateInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]

    BetaFeedbackInput:
      type: object
      required: [message, pagePath]
      properties:
        message:
          type: string
          minLength: 3
          maxLength: 4000
          description: What the user wants to tell us.
        pagePath:
          type: string
          maxLength: 512
          description: Route they were on when they sent it, e.g. /cases/14.
    BetaFeedbackAck:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time

    TimeEntry:
      type: object
      required: [id, caseId, caseTitle, userId, userName, workDate, minutes, billable, createdAt]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        caseTitle: { type: string }
        userId: { type: integer }
        userName: { type: string }
        workDate:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        minutes: { type: integer, description: Exact minutes. Never a fractional hour. }
        description: { type: ["string", "null"] }
        billable: { type: boolean }
        startedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    TimeEntryInput:
      type: object
      required: [caseId, workDate, minutes]
      properties:
        caseId: { type: integer }
        workDate:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        description: { type: string, maxLength: 2000 }
        billable: { type: boolean, default: true }

    TimerStartInput:
      type: object
      required: [caseId]
      properties:
        caseId: { type: integer }

    RunningTimer:
      type: ["object", "null"]
      required: [id, caseId, caseTitle, startedAt, elapsedMinutes]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        caseTitle: { type: string }
        startedAt: { type: string, format: date-time }
        elapsedMinutes: { type: integer }

    MetricValue:
      type: object
      description: A number with the evidence behind it, or null when there is too little.
      required: [value, sampleSize, enoughData]
      properties:
        value: { type: ["number", "null"] }
        previous: { type: ["number", "null"] }
        sampleSize: { type: integer }
        enoughData:
          type: boolean
          description: False when sampleSize is below the threshold; render a notice, not a chart.

    AgeingBucket:
      type: object
      required: [bucket, count]
      properties:
        bucket: { type: string, enum: ["0-30", "31-60", "61-90", "90+"] }
        count: { type: integer }

    CategoryMinutes:
      type: object
      required: [category, minutes]
      properties:
        category: { type: string }
        minutes: { type: integer }

    MemberMinutes:
      type: object
      description: Per-individual effort. Admin-only, by deliberate decision.
      required: [userId, userName, minutes, billableMinutes]
      properties:
        userId: { type: integer }
        userName: { type: string }
        minutes: { type: integer }
        billableMinutes: { type: integer }

    ChamberPerformance:
      type: object
      required:
        [
          from,
          to,
          comparisonFrom,
          comparisonTo,
          minimumSample,
          medianCycleTimeDays,
          medianTimeToFirstActionHours,
          ageingBuckets,
          overdueHearings,
          totalMinutes,
          billableMinutes,
          nonBillableMinutes,
          minutesPerOpenCase,
          byCategory,
          byMember,
          openCases,
          hasAnyTimeLogged,
        ]
      properties:
        from:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        to:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        comparisonFrom:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        comparisonTo:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: "Calendar date, YYYY-MM-DD.",
          }
        minimumSample:
          type: integer
          description: Below this many data points a metric reports enoughData false.
        medianCycleTimeDays: { $ref: "#/components/schemas/MetricValue" }
        medianTimeToFirstActionHours: { $ref: "#/components/schemas/MetricValue" }
        ageingBuckets:
          type: array
          items: { $ref: "#/components/schemas/AgeingBucket" }
        overdueHearings:
          type: integer
          description: Open matters whose hearing or deadline date is now in the past.
        totalMinutes: { $ref: "#/components/schemas/MetricValue" }
        billableMinutes: { type: integer }
        nonBillableMinutes: { type: integer }
        minutesPerOpenCase: { $ref: "#/components/schemas/MetricValue" }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/CategoryMinutes" }
        byMember:
          type: array
          items: { $ref: "#/components/schemas/MemberMinutes" }
        openCases: { type: integer }
        hasAnyTimeLogged:
          type: boolean
          description: False when the chamber has never logged time; the UI says so plainly.

    InvoiceLine:
      type: object
      required: [id, description, quantityMilli, unit, unitRateMinor, amountMinor]
      properties:
        id: { type: integer }
        position: { type: integer }
        description: { type: string }
        quantityMilli: { type: integer, description: Thousandths. 1.5 hours is 1500. }
        unit: { type: string }
        unitRateMinor: { type: integer, description: Paise per whole unit. }
        amountMinor: { type: integer, description: Paise. Stored, not recomputed on read. }
        sacCode: { type: ["string", "null"] }
        timeEntryId: { type: ["integer", "null"] }

    InvoiceLineInput:
      type: object
      required: [description, quantityMilli, unitRateMinor]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantityMilli: { type: integer, minimum: 1 }
        unit: { type: string, maxLength: 20 }
        unitRateMinor: { type: integer, minimum: 0 }
        sacCode: { type: string, maxLength: 20 }
        timeEntryId: { type: integer }

    Invoice:
      type: object
      required: [id, status, lines, subtotalMinor, totalMinor, currency, isOverdue, isEditable]
      properties:
        id: { type: integer }
        invoiceNumber: { type: ["integer", "null"] }
        financialYear: { type: ["string", "null"] }
        invoiceRef: { type: ["string", "null"] }
        status: { type: string }
        isOverdue: { type: boolean, description: Derived from the due date, never stored. }
        isEditable: { type: boolean }
        issueDate: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        clientId: { type: ["integer", "null"] }
        clientName: { type: string }
        clientAddress: { type: string }
        clientEmail: { type: string }
        clientGstin: { type: ["string", "null"] }
        firmName: { type: string }
        firmAddress: { type: string }
        firmGstin: { type: ["string", "null"] }
        taxTreatment: { type: string }
        placeOfSupply: { type: ["string", "null"] }
        sacCode: { type: ["string", "null"] }
        cgstRateBp: { type: integer }
        sgstRateBp: { type: integer }
        igstRateBp: { type: integer }
        subtotalMinor: { type: integer }
        cgstMinor: { type: integer }
        sgstMinor: { type: integer }
        igstMinor: { type: integer }
        totalMinor: { type: integer }
        currency: { type: string }
        notes: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        createdBy: { type: string }
        issuedBy: { type: ["string", "null"] }
        issuedAt: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"] }
        voidedBy: { type: ["string", "null"] }
        voidedAt: { type: ["string", "null"] }
        voidReason: { type: ["string", "null"] }
        createdAt: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }

    InvoiceDraftInput:
      type: object
      required: [clientId, lines]
      properties:
        clientId: { type: integer }
        issueDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        dueDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        notes: { type: string, maxLength: 2000 }
        paymentTerms: { type: string, maxLength: 500 }
        taxTreatment:
          type: string
          description: >
            intra | inter | exempt | reverse_charge | unspecified. Not decided by
            this application — the firm's accountant settles which applies.
        placeOfSupply: { type: string, maxLength: 100 }
        sacCode: { type: string, maxLength: 20 }
        cgstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        sgstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        igstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLineInput" }

    InvoiceStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [sent, paid, void] }
        reason: { type: string, maxLength: 500 }

    InvoiceList:
      type: object
      required: [invoices, outstandingMinor, overdueMinor, paidMinor, currency]
      properties:
        invoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        outstandingMinor: { type: integer, description: Issued or sent, not yet paid. }
        overdueMinor: { type: integer, description: Of the outstanding, past its due date. }
        paidMinor: { type: integer }
        currency: { type: string }

    UnbilledEntry:
      type: object
      required: [id, caseId, caseTitle, userName, workDate, minutes, billable]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        caseTitle: { type: string }
        clientId: { type: ["integer", "null"] }
        userName: { type: string }
        workDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        minutes: { type: integer }
        description: { type: ["string", "null"] }
        billable: { type: boolean }

    BillingSettings:
      type: object
      properties:
        firmName: { type: string }
        firmAddress: { type: string, maxLength: 1000 }
        firmGstin: { type: string, maxLength: 20 }
        firmPlaceOfSupply: { type: string, maxLength: 100 }
        defaultSacCode: { type: string, maxLength: 20 }
        defaultCgstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        defaultSgstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        defaultIgstRateBp: { type: integer, minimum: 0, maximum: 10000 }
        defaultHourlyRateMinor: { type: integer, minimum: 0 }
        defaultPaymentTerms: { type: string, maxLength: 500 }
        defaultPaymentDays: { type: integer, minimum: 0, maximum: 365 }
        nextInvoiceRef:
          { type: string, description: What the next issued invoice would be numbered. }

    # ── Case ──────────────────────────────────────────────────────────────
    Case:
      type: object
      required: [id, workspaceId, title, status, clientId, filingRef, createdAt, updatedAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
          description: Tenant the matter belongs to. Always the caller's active workspace.
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        filingRef:
          type: string
        opposingParty:
          type: ["string", "null"]
        conflictAcknowledgedBy:
          type: ["string", "null"]
        conflictNote:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        courtId:
          type: ["integer", "null"]
          description: >
            Which court the matter is before. Null opts the matter out of
            cause-list matching entirely — correct for anything not filed.
        caseType:
          type: ["string", "null"]
          description: 'As entered, for display: "W.P.(C)".'
        caseNumber:
          type: ["integer", "null"]
        caseYear:
          type: ["integer", "null"]
        courtName:
          type: ["string", "null"]
          description: Resolved from courtId for display. Not stored on the matter.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseInput:
      type: object
      required: [title, filingRef]
      properties:
        title:
          type: string
          minLength: 1
        opposingParty:
          type: string
          description: Who the matter is against. Screened for conflicts before the matter opens.
        conflictAcknowledged:
          type: boolean
          description: Set to proceed despite a reported conflict. Requires conflictNote.
        conflictNote:
          type: string
          description: Why the advocate judged the conflict not to apply. Recorded in the audit log.
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
          default: open
        clientId:
          type: integer
        filingRef:
          type: string
          minLength: 3
          description: >-
            Court or registry reference for the matter, e.g. CV-2026-118.
            Required — a matter that cannot be tied back to a filing is not
            findable in the place that counts.
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        courtId:
          type: integer
          description: >
            The court this matter is before. Optional — but a matter without
            it, and without the three fields below, can never be matched to a
            published cause list. `filingRef` above is free text and cannot
            substitute: a court's list keys on type, number and year, and
            chambers write filingRef a dozen different ways.
        caseType:
          type: string
          description: 'As printed on the filing: "W.P.(C)", "CRL.M.C.".'
        caseNumber:
          type: integer
        caseYear:
          type: integer

    CaseUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: integer
        filingRef:
          type: string
          minLength: 3
          description: >-
            Optional on update because this is a partial patch, but it cannot
            be cleared: omit it to leave it alone.
        priority:
          type: string
          enum: [low, medium, high, urgent]
        courtId:
          type: integer
          nullable: true
          description: >-
            Null clears the matter's court identity — all four fields go with
            it, and the matter stops being matched against cause lists. Omit to
            leave it alone. Correcting a mistyped number is otherwise the only
            way out of being proposed somebody else's listings.
        caseType:
          type: string
        caseNumber:
          type: integer
        caseYear:
          type: integer

    TimelineEvent:
      type: object
      required: [id, caseId, eventType, description, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        eventType:
          type: string
        description:
          type: string
        actorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # -- Audit, quota, privacy, conflicts -----------------------------------
    AuditEvent:
      type: object
      required: [id, action, summary, at]
      properties:
        id: { type: integer }
        actorName: { type: string }
        actorRole: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        summary: { type: string }
        ip: { type: ["string", "null"] }
        at: { type: string, format: date-time }

    UsageCounter:
      type: object
      required: [used]
      properties:
        used: { type: integer }
        limit:
          type: ["integer", "null"]
          description: Null means unlimited on this plan.

    Usage:
      type: object
      required: [plan, matters, seats]
      properties:
        plan: { type: string, enum: [trial, pro, firm, custom] }
        matters: { $ref: "#/components/schemas/UsageCounter" }
        seats: { $ref: "#/components/schemas/UsageCounter" }

    ConflictCheckInput:
      type: object
      required: [opposingParty]
      properties:
        opposingParty: { type: string }

    ErasureRequestInput:
      type: object
      properties:
        reason: { type: string }

    ErasureDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [complete, reject] }
        note: { type: string }

    ConflictHit:
      type: object
      required: [kind, detail]
      properties:
        kind: { type: string, enum: [existing_client, opposing_party, matter_title] }
        detail: { type: string }
        caseId: { type: ["integer", "null"] }

    ErasureRequest:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: integer }
        requestedName: { type: string }
        requestedEmail: { type: string }
        reason: { type: ["string", "null"] }
        status: { type: string, enum: [pending, completed, rejected] }
        decidedBy: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        decisionNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    DataExport:
      type: object
      required: [generatedAt, subject, workspace]
      properties:
        generatedAt: { type: string, format: date-time }
        subject:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            role: { type: string }
            joinedAt: { type: ["string", "null"], format: date-time }
        workspace:
          type: object
          properties:
            name: { type: string }
        cases: { type: array, items: { type: object, additionalProperties: true } }
        documents: { type: array, items: { type: object, additionalProperties: true } }
        documentRequests: { type: array, items: { type: object, additionalProperties: true } }
        feedback: { type: array, items: { type: object, additionalProperties: true } }
        consultations: { type: array, items: { type: object, additionalProperties: true } }

    # ── Subscription ──────────────────────────────────────────────────────
    PlanQuote:
      type: object
      required:
        [
          plan,
          billingPeriod,
          months,
          paidMonths,
          freeMonths,
          amountMinor,
          effectiveMonthlyMinor,
          listMinor,
          savingsMinor,
          currency,
          name,
          quoteOnly,
          renews,
        ]
      properties:
        plan:
          type: string
          enum: [trial, pro, firm, custom]
        billingPeriod:
          type: string
          enum: [one_time, monthly, half_yearly, yearly]
        months:
          type: integer
          description: Months of service the period covers.
        paidMonths:
          type: integer
          description: Months actually charged for.
        freeMonths:
          type: integer
          description: Months granted free. Two on the yearly plans.
        amountMinor:
          type: integer
          description: Total for the period, in paise.
        effectiveMonthlyMinor:
          type: integer
          description: Amount per month across the term, in paise.
        listMinor:
          type: integer
          description: What the same months cost billed monthly, in paise.
        savingsMinor:
          type: integer
        currency:
          type: string
        name:
          type: string
          description: Display name of the plan.
        quoteOnly:
          type: boolean
          description: >-
            True when the plan has no list price and is scoped by a person.
            Selecting it records an enquiry; it never becomes an active plan.
        renews:
          type: boolean
          description: False for the trial pack, which runs its two months and stops.

    Subscription:
      type: object
      required: [workspaceId, plan, billingPeriod, status, currency]
      properties:
        workspaceId:
          type: integer
        plan:
          type: string
          enum: [trial, pro, firm, custom]
        billingPeriod:
          type: string
          enum: [one_time, monthly, half_yearly, yearly]
        status:
          type: string
          enum: [trialing, pending_payment, active, past_due, cancelled]
          description: >
            The last transition written to the row. `pending_payment` means a
            chargeable plan was selected and the signed webhook has not yet
            confirmed payment. Note this is the STORED status — a row may read
            `active` while its period has already elapsed; see `lapsed`.
        paidMonths:
          type: integer
        freeMonths:
          type: integer
        amountMinor:
          type: integer
        currency:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        currentPeriodEnd:
          type: ["string", "null"]
          format: date-time
        lapsed:
          type: boolean
          description: >
            Whether the period has elapsed, derived server-side on every read.
            Never computed in the browser: the browser's clock is not what
            enforcement uses, and the two disagreeing would show a chamber a
            plan the server has already stopped honouring.
        daysLeft:
          type: ["integer", "null"]
          description: >
            Whole days until `currentPeriodEnd`, server-computed. Null when no
            period is running, negative once it has elapsed.
        updatedBy:
          type: ["string", "null"]

    SubscriptionState:
      type: object
      required: [subscription, catalogue, canManage]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        catalogue:
          type: array
          items:
            $ref: "#/components/schemas/PlanQuote"
        canManage:
          type: boolean
          description: Whether the caller holds billing.manage in this workspace.

    BillingConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: False when no payment provider is configured.
        keyId:
          type: ["string", "null"]
          description: The provider's PUBLIC key, for the browser checkout.
        provider:
          type: ["string", "null"]

    CheckoutOrder:
      type: object
      required: [orderId, amountMinor, currency, plan, billingPeriod]
      properties:
        orderId:
          type: string
        amountMinor:
          type: integer
          description: Total in paise, computed server-side.
        currency:
          type: string
        plan:
          type: string
          enum: [trial, pro, firm, custom]
        billingPeriod:
          type: string
          enum: [one_time, monthly, half_yearly, yearly]

    Court:
      type: object
      required: [id, code, name, bench, jurisdiction, active]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        bench:
          type: string
          description: The seat, where a court sits at more than one. Empty otherwise.
        jurisdiction:
          type: string
        active:
          type: boolean
        syncable:
          type: boolean
          description: >
            Whether an adapter is registered for this court in this build. False
            means the court can be recorded on a matter but its list is never
            read — the honest state for a court whose adapter is unwritten.

    CauseListProposal:
      type: object
      required: [id, status, confidence, caseId, caseTitle, listDate, courtName, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, accepted, dismissed]
        confidence:
          type: string
          enum: [exact]
        caseId:
          type: integer
        caseTitle:
          type: string
        listDate:
          type: string
          description: YYYY-MM-DD — the day the court has listed it for.
        courtName:
          type: string
        caseRef:
          type: string
          description: 'As printed on the list, e.g. "W.P.(C) 1234/2026".'
        parties:
          type: string
        courtNo:
          type: string
        itemNo:
          type: string
        coram:
          type: string
        purpose:
          type: string
        rawText:
          type: string
          description: The listing exactly as read, before parsing. Evidence, not decoration.
        calendarEntryId:
          type: ["integer", "null"]
          description: The calendar entry accepting it created. Null until accepted.
        decidedBy:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CauseListDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, dismiss]

    CauseListSyncRun:
      type: object
      required:
        [id, courtId, courtName, adapter, listDate, status, fetched, upserted, proposed, startedAt]
      properties:
        id:
          type: integer
        courtId:
          type: integer
        courtName:
          type: string
        adapter:
          type: string
        listDate:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped]
        fetched:
          type: integer
        upserted:
          type: integer
        proposed:
          type: integer
        error:
          type: ["string", "null"]
        durationMs:
          type: integer
        startedAt:
          type: string
          format: date-time

    CauseListSyncInput:
      type: object
      required: [courtCode, listDate]
      properties:
        courtCode:
          type: string
        listDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >
            A patterned string, not format:date — `format: date` generates
            zod.date(), which rejects the string a browser actually sends.

    CauseListSyncRunResult:
      type: object
      required: [courtId, status, fetched, upserted, proposed]
      properties:
        courtId:
          type: integer
        status:
          type: string
          enum: [ok, failed, skipped]
        fetched:
          type: integer
        upserted:
          type: integer
        proposed:
          type: integer
        error:
          type: string

    ServiceEnquiryInput:
      type: object
      required: [serviceKind, message, contactPreference]
      properties:
        serviceKind:
          type: string
          enum: [migration]
        message:
          type: string
          minLength: 3
          maxLength: 4000
        contactPreference:
          type: string
          enum: [email, phone]
        contactPhone:
          type: string
          maxLength: 32
          description: Required when contactPreference is "phone".
    ServiceEnquiryAck:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time

    SubscriptionInput:
      type: object
      required: [plan, billingPeriod]
      properties:
        plan:
          type: string
          enum: [trial, pro, firm, custom]
        billingPeriod:
          type: string
          enum: [one_time, monthly, half_yearly, yearly]

    # ── Document ──────────────────────────────────────────────────────────
    Feedback:
      type: object
      required: [id, workspaceId, caseId, clientId, rating, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        caseId:
          type: integer
        caseTitle:
          type: ["string", "null"]
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        response:
          type: ["string", "null"]
        respondedBy:
          type: ["string", "null"]
        respondedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    FeedbackInput:
      type: object
      required: [caseId, rating]
      properties:
        caseId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    FeedbackResponseInput:
      type: object
      required: [response]
      properties:
        response:
          type: string
          minLength: 1

    Document:
      type: object
      required: [id, caseId, name, encrypted, uploadedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        fileType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        encrypted:
          type: boolean
        storagePath:
          type: ["string", "null"]
        checksum:
          type: ["string", "null"]
          description: SHA-256 of the stored bytes.
        url:
          type: ["string", "null"]
          description: Where the file lives. Object storage in production.
        visibility:
          type: string
          enum: [firm, shared]
          description: >
            'firm' is internal working material a client never sees. 'shared' is
            visible to the client on the matter. A client's own upload is always
            'shared'.
        uploadedBy:
          type: ["string", "null"]
        uploadedByRole:
          type: ["string", "null"]
        documentRequestId:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        caseTitle:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time

    DocumentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        fileType:
          type: string
        fileSize:
          type: integer
        storagePath:
          type: string
        url:
          type: string
        note:
          type: string
        visibility:
          type: string
          enum: [firm, shared]
          description: Ignored for clients, whose uploads are always 'shared'.
        documentRequestId:
          type: integer
          description: Set to fulfil a specific document request.

    # ── Task ──────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, caseId, title, status, priority, deadline, createdAt, updatedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        deadline:
          type: string
          format: date
        completedAt:
          type: ["string", "null"]
          format: date-time
        isOverdue:
          type: boolean
        hasDelayLog:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [caseId, title, deadline]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskCompletion:
      type: object
      properties:
        delayReason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        delayNotes:
          type: string
        proofFileName:
          type: string

    # ── Delay Log ─────────────────────────────────────────────────────────
    DelayLog:
      type: object
      required: [id, taskId, reason, submittedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: ["string", "null"]
        proofFileName:
          type: ["string", "null"]
        submittedAt:
          type: string
          format: date-time

    DelayLogInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: string
        proofFileName:
          type: string

    # ── Consultation ──────────────────────────────────────────────────────
    Consultation:
      type: object
      required: [id, caseId, title, consentGiven, status, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        consentGiven:
          type: boolean
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        category:
          type: ["string", "null"]
          enum:
            [
              legal_solution,
              regulatory_solution,
              business_consultation,
              procedural_compliance,
              null,
            ]
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ConsultationInput:
      type: object
      required: [caseId, title, consentGiven, category]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        notes:
          type: string
        consentGiven:
          type: boolean
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    ConsultationUpdate:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    # ── KPI ───────────────────────────────────────────────────────────────
    KpiDashboard:
      type: object
      required:
        [
          totalCases,
          openCases,
          closedCases,
          totalTasks,
          overdueTasks,
          completedOnTime,
          slaAdherencePercent,
          avgTurnaroundDays,
        ]
      properties:
        totalCases:
          type: integer
        openCases:
          type: integer
        closedCases:
          type: integer
        totalTasks:
          type: integer
        overdueTasks:
          type: integer
        completedOnTime:
          type: integer
        slaAdherencePercent:
          type: number
        avgTurnaroundDays:
          type: number
        tasksByStatus:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatusCount"
        casesByPriority:
          type: array
          items:
            $ref: "#/components/schemas/CasePriorityCount"

    TaskStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    CasePriorityCount:
      type: object
      required: [priority, count]
      properties:
        priority:
          type: string
        count:
          type: integer

    SlaReportEntry:
      type: object
      required: [period, totalTasks, onTime, late, slaPercent]
      properties:
        period:
          type: string
        totalTasks:
          type: integer
        onTime:
          type: integer
        late:
          type: integer
        slaPercent:
          type: number

    DashboardSummary:
      type: object
      required: [activeCases, pendingTasks, upcomingConsultations, recentActivity]
      properties:
        activeCases:
          type: integer
        pendingTasks:
          type: integer
        upcomingConsultations:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    # ── Invite ────────────────────────────────────────────────────────────
    Invite:
      type: object
      required: [id, email, phone, token, role, createdAt, expiresAt]
      properties:
        id:
          type: integer
        email:
          type: string
          description: The address invited, or "" when the invite names a number instead.
        phone:
          type: string
          description: The mobile number invited in E.164, or "" when it names an address.
        token:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        caseId:
          type: ["integer", "null"]
        usedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    InviteInput:
      type: object
      required: [role]
      description: >
        Addressed to exactly one of email or phone. Supplying both, or neither,
        is refused — not modelled here because JSON Schema expresses
        "exactly one of" badly; see routes/invites.ts for the actual rule.
      properties:
        email:
          type: string
        phone:
          type: string
          description: >
            Mobile number. Ten digits is read as Indian; any other country
            needs the full +code form. Stored normalised to E.164.
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: The role the invited person is admitted at. Chosen by the admin.
        caseId:
          type: integer
          description: >
            Required when role is "client" — the server rejects a client
            invite with no caseId, and rejects a caseId on any other role.
            Not modelled as conditionally required here because it depends on
            a sibling field's value, which JSON Schema expresses badly; see
            routes/invites.ts for the actual rule.

    # ── Notifications ───────────────────────────────────────────────────────
    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          description: The FCM registration token. Opaque.
        platform:
          type: string
          enum: [ios, android]

    RegisteredDevice:
      type: object
      required: [id, platform]
      properties:
        id:
          type: integer
        platform:
          type: string

    Notification:
      type: object
      required: [id, userId, type, message, read, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        type:
          type: string
          enum: [reminder, document_request, general]
        message:
          type: string
        read:
          type: boolean
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MarkAllReadResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    # ── Document Requests ───────────────────────────────────────────────────
    DocumentRequest:
      type: object
      required: [id, clientId, clientClerkId, requestedBy, documentName, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientClerkId:
          type: string
        clientName:
          type: ["string", "null"]
        requestedFromName:
          type: ["string", "null"]
          description: Display name of the person the document is being requested FROM.
        requestedFromEmail:
          type: ["string", "null"]
        requestedBy:
          type: string
          description: Display name of the staff member who raised the request.
        requestedByRole:
          type: ["string", "null"]
        documentName:
          type: string
        note:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        caseId:
          type: ["integer", "null"]
        caseTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, fulfilled, dismissed]
        fulfilledDocumentId:
          type: ["integer", "null"]
        fulfilledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    DocumentRequestInput:
      type: object
      required: [clientId, documentName]
      properties:
        clientId:
          type: integer
          description: The recipient — the user the document is requested FROM.
        documentName:
          type: string
          minLength: 1
        note:
          type: string
        dueDate:
          type: string
          description: Date the recipient is asked to respond by (YYYY-MM-DD).
        caseId:
          type: integer

    DocumentRequestUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, fulfilled, dismissed]

    # ── Search ──────────────────────────────────────────────────────────────
    SearchResultItem:
      type: object
      required: [id, title, subtitle]
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string

    SearchResults:
      type: object
      required: [cases, tasks, consultations, clients]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        consultations:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
