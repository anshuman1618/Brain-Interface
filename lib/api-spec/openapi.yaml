openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Private Practice Management & Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Verified session context, workspace membership and access requests
  - name: users
    description: User directory
  - name: cases
    description: Case management
  - name: documents
    description: Case document vault
  - name: tasks
    description: Task pipeline and SLA
  - name: delay-logs
    description: Mandatory delay logging
  - name: notifications
    description: In-app notification centre
  - name: document-requests
    description: Advocate-to-client document requests
  - name: search
    description: Global search
  - name: consultations
    description: Consultation recorder
  - name: kpi
    description: KPI engine (admin only)
  - name: invites
    description: Invite link generation
  - name: calendar
    description: Master calendar updates
  - name: feedback
    description: Client feedback on matters

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── Session & workspaces ───────────────────────────────────────────────────
  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Verified session claims
      description: >
        The authoritative description of who the caller is, which workspaces they
        are an active member of, and what they may do in the active one. The
        frontend renders exclusively from this payload; it is the only source of
        UI visibility. Never derived from client state.
      responses:
        "200":
          description: Session claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized

  /session/workspace:
    post:
      operationId: switchWorkspace
      tags: [session]
      summary: Switch the active workspace
      description: >
        Verifies the caller holds an ACTIVE membership of the requested workspace
        and, only then, mints a scoped workspace token. A workspace the caller is
        not mapped to answers 403 — there is no client-side way to select one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSwitchInput"
      responses:
        "200":
          description: Scoped session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized
        "403":
          description: Not an active member of that workspace

  /workspaces:
    post:
      operationId: createWorkspace
      tags: [session]
      summary: Create a chamber and become its owner
      description: >
        Self-serve sign-up. The caller creates a brand-new, empty workspace and
        becomes its owner at the role they choose (Firm Admin or Senior
        Advocate). Ownership adds the management capabilities so a founder can
        invite their own team whatever practice title they hold — and confers
        nothing in any other workspace. This is the only role a user can choose
        for themselves, and it only ever applies to a chamber that did not exist
        a moment ago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateInput"
      responses:
        "201":
          description: Chamber created; session now scoped to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized
        "409":
          description: That chamber name is already taken
    get:
      operationId: listWorkspaces
      tags: [session]
      summary: Workspaces the caller is explicitly mapped to
      description: >
        Returns only workspaces backed by a membership row for this user. Pending
        rows are included but flagged, so the switcher can show "awaiting
        approval" without ever offering them as selectable.
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMembershipSummary"
        "401":
          description: Unauthorized

  /access-requests:
    get:
      operationId: listAccessRequests
      tags: [session]
      summary: Pending access requests for the active workspace (admin only)
      responses:
        "200":
          description: Access requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
    post:
      operationId: createAccessRequest
      tags: [session]
      summary: Request access to a workspace
      description: >
        Records intent only. The requested role is stored as `requestedRole` and
        grants nothing; the membership is created with status `pending`. Approval
        is an explicit admin action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestInput"
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "401":
          description: Unauthorized
        "409":
          description: A membership or request already exists

  /access-requests/{id}/decision:
    post:
      operationId: decideAccessRequest
      tags: [session]
      summary: Approve or deny an access request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionInput"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
        "404":
          description: Request not found in this workspace

  /calendar:
    get:
      operationId: listCalendarEntries
      tags: [calendar]
      summary: Calendar updates visible to the caller
      description: >
        Scoped twice: to the caller's workspace, and to entries whose audience
        includes their role or their user id. A client never receives a
        staff-only notice.
      responses:
        "200":
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden
    post:
      operationId: createCalendarEntry
      tags: [calendar]
      summary: Post a calendar update (Admin and Senior Advocate only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden

  /calendar/{id}:
    patch:
      operationId: updateCalendarEntry
      tags: [calendar]
      summary: Move or edit a calendar entry (Admin and Senior Advocate only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntryUpdate"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace
    delete:
      operationId: deleteCalendarEntry
      tags: [calendar]
      summary: Remove a calendar update (Admin and Senior Advocate only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace

  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: Feedback visible to the caller
      description: >
        Staff see every rating in the workspace; a client sees only their own.
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Leave feedback on one of your matters (clients only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
        "409":
          description: You have already rated this matter

  /feedback/{id}/response:
    post:
      operationId: respondToFeedback
      tags: [feedback]
      summary: Reply to a client's feedback (Admin and Senior Advocate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackResponseInput"
      responses:
        "200":
          description: Response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace

  /documents:
    get:
      operationId: listWorkspaceDocuments
      tags: [documents]
      summary: Every document the caller may see, across their matters
      description: >
        Scoped by matter visibility and, for clients, by document visibility —
        firm-internal files are never returned to a client.
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "403":
          description: Forbidden

  /workspace/access-list:
    get:
      operationId: listAccessList
      tags: [session]
      summary: Email addresses and domains admitted to this workspace (admin only)
      responses:
        "200":
          description: Access list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessListEntry"
        "403":
          description: Forbidden
    post:
      operationId: createAccessListEntry
      tags: [session]
      summary: Admit an address or domain, with the role it is granted (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessListEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessListEntry"
        "403":
          description: Forbidden
        "409":
          description: That address or domain is already on the list

  /workspace/access-list/{id}:
    delete:
      operationId: revokeAccessListEntry
      tags: [session]
      summary: Revoke an access-list entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
        "403":
          description: Forbidden
        "404":
          description: Entry not found in this workspace

  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [session]
      summary: Active members of the current workspace (admin only)
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden

  /workspace/members/{id}:
    patch:
      operationId: updateWorkspaceMember
      tags: [session]
      summary: Change a member's role or revoke them (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdateInput"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
        "404":
          description: Member not found in this workspace

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, senior_advocate, junior_advocate, clerk_intern, clerk, client]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  # ── Cases ──────────────────────────────────────────────────────────────────
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases (filtered by role)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, review, closed]
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a single case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Delete a case (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cases/{id}/timeline:
    get:
      operationId: getCaseTimeline
      tags: [cases]
      summary: Get case activity timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # ── Documents ──────────────────────────────────────────────────────────────
  /cases/{caseId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Add a document stub to a case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /cases/{caseId}/documents/{docId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
        - in: path
          name: docId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Tasks ──────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks (filtered by role/assignment)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - in: query
          name: assigneeId
          schema:
            type: string
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create and assign a task (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/overdue:
    get:
      operationId: listOverdueTasks
      tags: [tasks]
      summary: List all overdue tasks
      responses:
        "200":
          description: Overdue tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete (with optional delay log)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          description: Delay reason required

  # ── Delay Logs ─────────────────────────────────────────────────────────────
  /tasks/{id}/delay-log:
    post:
      operationId: createDelayLog
      tags: [delay-logs]
      summary: Submit a delay reason for an overdue task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelayLogInput"
      responses:
        "201":
          description: Delay log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelayLog"

  # ── Consultations ──────────────────────────────────────────────────────────
  /consultations:
    get:
      operationId: listConsultations
      tags: [consultations]
      summary: List consultations
      parameters:
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of consultations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultation"
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Create a consultation record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  /consultations/{id}:
    get:
      operationId: getConsultation
      tags: [consultations]
      summary: Get a consultation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consultation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
    patch:
      operationId: updateConsultation
      tags: [consultations]
      summary: Update a consultation (add transcript, audio URL, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationUpdate"
      responses:
        "200":
          description: Updated consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  # ── KPI Dashboard ──────────────────────────────────────────────────────────
  /kpi/dashboard:
    get:
      operationId: getKpiDashboard
      tags: [kpi]
      summary: KPI dashboard summary (admin only)
      responses:
        "200":
          description: KPI metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDashboard"

  /kpi/sla-report:
    get:
      operationId: getSlaReport
      tags: [kpi]
      summary: SLA adherence report by time period (admin only)
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, quarter]
            default: month
      responses:
        "200":
          description: SLA report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaReportEntry"

  # ── Dashboard Summary (wow) ────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [kpi]
      summary: High-level dashboard counts and pipeline summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Invites ────────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResult"
  /document-requests:
    get:
      operationId: listDocumentRequests
      tags: [document-requests]
      summary: List document requests (staff sees all; clients see their own)
      responses:
        "200":
          description: List of document requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRequest"
    post:
      operationId: createDocumentRequest
      tags: [document-requests]
      summary: Create a document request for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestInput"
      responses:
        "201":
          description: Created document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /document-requests/{id}:
    patch:
      operationId: updateDocumentRequest
      tags: [document-requests]
      summary: Update document request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestUpdate"
      responses:
        "200":
          description: Updated document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across cases, tasks, consultations, clients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grouped search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List pending invites (admin only)
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Generate an invite link for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── User ──────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, roleSelected, displayName, email, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, clerk, client]
        roleSelected:
          type: boolean
          description: True once the user has completed self-service role selection at sign-up.
        displayName:
          type: string
        email:
          type: string
        authProvider:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string

    # ── Session & workspaces ──────────────────────────────────────────────
    Workspace:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [chamber, client_portal]

    WorkspaceMembershipSummary:
      type: object
      required: [workspace, role, status]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        status:
          type: string
          enum: [pending, active, revoked]
        isOwner:
          type: boolean
        requestedRole:
          type: ["string", "null"]

    SessionClaims:
      type: object
      required:
        [userId, clerkId, displayName, email, accessStatus, memberships, capabilities, isOwner]
      properties:
        userId:
          type: integer
        clerkId:
          type: string
        displayName:
          type: string
        email:
          type: string
        accessStatus:
          type: string
          enum: [not_recognised, pending_approval, active]
          description: >
            active   — holds at least one ACTIVE membership.
            pending_approval — has asked for access and is awaiting a decision.
            not_recognised — signed in successfully, but the verified email is on
            no workspace access list and no request is outstanding. Reaches
            nothing; the sign-in layer shows an error naming the address.
        authProvider:
          type: ["string", "null"]
          description: How the caller signed in (google | zoho | email). Display only.
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembershipSummary"
        activeWorkspace:
          oneOf:
            - $ref: "#/components/schemas/Workspace"
            - type: "null"
        role:
          type: ["string", "null"]
          description: Role in the active workspace, resolved from the membership row.
        displayRole:
          type: ["string", "null"]
        isOwner:
          type: boolean
          description: True when the caller founded the active workspace.
        capabilities:
          type: array
          description: Server-resolved capability list. The UI renders from this and nothing else.
          items:
            type: string
        workspaceToken:
          type: ["string", "null"]
          description: Scoped token for the active workspace, minted after membership was verified.

    WorkspaceSwitchInput:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: integer

    AccessRequest:
      type: object
      required: [id, workspaceId, userId, clerkId, role, status, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        workspaceName:
          type: ["string", "null"]
        userId:
          type: integer
        clerkId:
          type: string
        displayName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
        requestedRole:
          type: ["string", "null"]
        requestNote:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, revoked]
        decidedBy:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccessRequestInput:
      type: object
      required: [workspaceSlug]
      properties:
        workspaceSlug:
          type: string
          description: The workspace being applied to.
        requestedRole:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: Intent only. Never granted automatically.
        note:
          type: string

    AccessDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: >
            The role the admin grants. Required on approve. Deliberately separate
            from requestedRole — an applicant asking for admin does not get it.

    WorkspaceCreateInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 2
          description: The chamber's name, e.g. "Raghavan Chambers".
        role:
          type: string
          enum: [admin, senior_advocate]
          description: >
            The founder's own role. Restricted to these two — a chamber must be
            created by someone who will run it.

    CalendarEntry:
      type: object
      required: [id, workspaceId, title, kind, entryDate, audience, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
        entryDate:
          type: string
        entryTime:
          type: ["string", "null"]
        caseId:
          type: ["integer", "null"]
        caseTitle:
          type: ["string", "null"]
        audience:
          type: string
        audienceLabel:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        createdByRole:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CalendarEntryInput:
      type: object
      required: [title, entryDate]
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
          default: note
        entryDate:
          type: string
          description: YYYY-MM-DD
        entryTime:
          type: string
        caseId:
          type: integer
        audience:
          type: string
          default: all
          description: 'all | staff | role:<role> | user:<clerkId>'

    CalendarEntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        kind:
          type: string
          enum: [hearing, filing, meeting, note]
        entryDate:
          type: string
        entryTime:
          type: string
        caseId:
          type: integer
        audience:
          type: string

    AccessListEntry:
      type: object
      required: [id, workspaceId, kind, value, role, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        kind:
          type: string
          enum: [email, domain]
        value:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        note:
          type: ["string", "null"]
        addedBy:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccessListEntryInput:
      type: object
      required: [kind, value, role]
      properties:
        kind:
          type: string
          enum: [email, domain]
        value:
          type: string
          minLength: 3
          description: An exact email address, or a bare domain such as "chambers.in".
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: The role granted on first sign-in. Chosen by the admin.
        note:
          type: string

    MembershipUpdateInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        status:
          type: string
          enum: [active, revoked]

    UserRoleUpdateInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]

    # ── Case ──────────────────────────────────────────────────────────────
    Case:
      type: object
      required: [id, workspaceId, title, status, clientId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
          description: Tenant the matter belongs to. Always the caller's active workspace.
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        filingRef:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
          default: open
        clientId:
          type: integer
        filingRef:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium

    CaseUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: integer
        filingRef:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]

    TimelineEvent:
      type: object
      required: [id, caseId, eventType, description, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        eventType:
          type: string
        description:
          type: string
        actorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Document ──────────────────────────────────────────────────────────
    Feedback:
      type: object
      required: [id, workspaceId, caseId, clientId, rating, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        caseId:
          type: integer
        caseTitle:
          type: ["string", "null"]
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        response:
          type: ["string", "null"]
        respondedBy:
          type: ["string", "null"]
        respondedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    FeedbackInput:
      type: object
      required: [caseId, rating]
      properties:
        caseId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    FeedbackResponseInput:
      type: object
      required: [response]
      properties:
        response:
          type: string
          minLength: 1

    Document:
      type: object
      required: [id, caseId, name, encrypted, uploadedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        fileType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        encrypted:
          type: boolean
        storagePath:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
          description: Where the file lives. Object storage in production.
        visibility:
          type: string
          enum: [firm, shared]
          description: >
            'firm' is internal working material a client never sees. 'shared' is
            visible to the client on the matter. A client's own upload is always
            'shared'.
        uploadedBy:
          type: ["string", "null"]
        uploadedByRole:
          type: ["string", "null"]
        documentRequestId:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        caseTitle:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time

    DocumentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        fileType:
          type: string
        fileSize:
          type: integer
        storagePath:
          type: string
        url:
          type: string
        note:
          type: string
        visibility:
          type: string
          enum: [firm, shared]
          description: Ignored for clients, whose uploads are always 'shared'.
        documentRequestId:
          type: integer
          description: Set to fulfil a specific document request.

    # ── Task ──────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, caseId, title, status, priority, deadline, createdAt, updatedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        deadline:
          type: string
          format: date
        completedAt:
          type: ["string", "null"]
          format: date-time
        isOverdue:
          type: boolean
        hasDelayLog:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [caseId, title, deadline]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskCompletion:
      type: object
      properties:
        delayReason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        delayNotes:
          type: string
        proofFileName:
          type: string

    # ── Delay Log ─────────────────────────────────────────────────────────
    DelayLog:
      type: object
      required: [id, taskId, reason, submittedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: ["string", "null"]
        proofFileName:
          type: ["string", "null"]
        submittedAt:
          type: string
          format: date-time

    DelayLogInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: string
        proofFileName:
          type: string

    # ── Consultation ──────────────────────────────────────────────────────
    Consultation:
      type: object
      required: [id, caseId, title, consentGiven, status, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]
        transcriptPlaceholder:
          type: ["string", "null"]
        consentGiven:
          type: boolean
        status:
          type: string
          enum: [scheduled, recording, completed, cancelled]
        category:
          type: ["string", "null"]
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance, null]
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ConsultationInput:
      type: object
      required: [caseId, title, consentGiven, category]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        notes:
          type: string
        consentGiven:
          type: boolean
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    ConsultationUpdate:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string
        audioUrl:
          type: string
        transcriptPlaceholder:
          type: string
        status:
          type: string
          enum: [scheduled, recording, completed, cancelled]
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    # ── KPI ───────────────────────────────────────────────────────────────
    KpiDashboard:
      type: object
      required: [totalCases, openCases, closedCases, totalTasks, overdueTasks, completedOnTime, slaAdherencePercent, avgTurnaroundDays]
      properties:
        totalCases:
          type: integer
        openCases:
          type: integer
        closedCases:
          type: integer
        totalTasks:
          type: integer
        overdueTasks:
          type: integer
        completedOnTime:
          type: integer
        slaAdherencePercent:
          type: number
        avgTurnaroundDays:
          type: number
        tasksByStatus:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatusCount"
        casesByPriority:
          type: array
          items:
            $ref: "#/components/schemas/CasePriorityCount"

    TaskStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    CasePriorityCount:
      type: object
      required: [priority, count]
      properties:
        priority:
          type: string
        count:
          type: integer

    SlaReportEntry:
      type: object
      required: [period, totalTasks, onTime, late, slaPercent]
      properties:
        period:
          type: string
        totalTasks:
          type: integer
        onTime:
          type: integer
        late:
          type: integer
        slaPercent:
          type: number

    DashboardSummary:
      type: object
      required: [activeCases, pendingTasks, upcomingConsultations, recentActivity]
      properties:
        activeCases:
          type: integer
        pendingTasks:
          type: integer
        upcomingConsultations:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    # ── Invite ────────────────────────────────────────────────────────────
    Invite:
      type: object
      required: [id, email, token, role, createdAt, expiresAt]
      properties:
        id:
          type: integer
        email:
          type: string
        token:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
        caseId:
          type: ["integer", "null"]
        usedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    InviteInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, senior_advocate, junior_advocate, clerk_intern, client]
          description: The role the invited person is admitted at. Chosen by the admin.
        caseId:
          type: integer

    # ── Notifications ───────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, userId, type, message, read, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        type:
          type: string
          enum: [reminder, document_request, general]
        message:
          type: string
        read:
          type: boolean
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MarkAllReadResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    # ── Document Requests ───────────────────────────────────────────────────
    DocumentRequest:
      type: object
      required: [id, clientId, clientClerkId, requestedBy, documentName, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientClerkId:
          type: string
        clientName:
          type: ["string", "null"]
        requestedFromName:
          type: ["string", "null"]
          description: Display name of the person the document is being requested FROM.
        requestedFromEmail:
          type: ["string", "null"]
        requestedBy:
          type: string
          description: Display name of the staff member who raised the request.
        requestedByRole:
          type: ["string", "null"]
        documentName:
          type: string
        note:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        caseId:
          type: ["integer", "null"]
        caseTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, fulfilled, dismissed]
        fulfilledDocumentId:
          type: ["integer", "null"]
        fulfilledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    DocumentRequestInput:
      type: object
      required: [clientId, documentName]
      properties:
        clientId:
          type: integer
          description: The recipient — the user the document is requested FROM.
        documentName:
          type: string
          minLength: 1
        note:
          type: string
        dueDate:
          type: string
          description: Date the recipient is asked to respond by (YYYY-MM-DD).
        caseId:
          type: integer

    DocumentRequestUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, fulfilled, dismissed]

    # ── Search ──────────────────────────────────────────────────────────────
    SearchResultItem:
      type: object
      required: [id, title, subtitle]
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string

    SearchResults:
      type: object
      required: [cases, tasks, consultations, clients]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        consultations:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
