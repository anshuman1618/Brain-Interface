openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Private Practice Management & Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and role management
  - name: cases
    description: Case management
  - name: documents
    description: Case document vault
  - name: tasks
    description: Task pipeline and SLA
  - name: delay-logs
    description: Mandatory delay logging
  - name: notifications
    description: In-app notification centre
  - name: document-requests
    description: Advocate-to-client document requests
  - name: search
    description: Global search
  - name: consultations
    description: Consultation recorder
  - name: kpi
    description: KPI engine (admin only)
  - name: invites
    description: Invite link generation

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, clerk, client]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  # ── Cases ──────────────────────────────────────────────────────────────────
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases (filtered by role)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, review, closed]
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a single case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Delete a case (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cases/{id}/timeline:
    get:
      operationId: getCaseTimeline
      tags: [cases]
      summary: Get case activity timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # ── Documents ──────────────────────────────────────────────────────────────
  /cases/{caseId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Add a document stub to a case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /cases/{caseId}/documents/{docId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
        - in: path
          name: docId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Tasks ──────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks (filtered by role/assignment)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - in: query
          name: assigneeId
          schema:
            type: string
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create and assign a task (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/overdue:
    get:
      operationId: listOverdueTasks
      tags: [tasks]
      summary: List all overdue tasks
      responses:
        "200":
          description: Overdue tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete (with optional delay log)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          description: Delay reason required

  # ── Delay Logs ─────────────────────────────────────────────────────────────
  /tasks/{id}/delay-log:
    post:
      operationId: createDelayLog
      tags: [delay-logs]
      summary: Submit a delay reason for an overdue task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelayLogInput"
      responses:
        "201":
          description: Delay log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelayLog"

  # ── Consultations ──────────────────────────────────────────────────────────
  /consultations:
    get:
      operationId: listConsultations
      tags: [consultations]
      summary: List consultations
      parameters:
        - in: query
          name: caseId
          schema:
            type: integer
      responses:
        "200":
          description: List of consultations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultation"
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Create a consultation record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  /consultations/{id}:
    get:
      operationId: getConsultation
      tags: [consultations]
      summary: Get a consultation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consultation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
    patch:
      operationId: updateConsultation
      tags: [consultations]
      summary: Update a consultation (add transcript, audio URL, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationUpdate"
      responses:
        "200":
          description: Updated consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"

  # ── KPI Dashboard ──────────────────────────────────────────────────────────
  /kpi/dashboard:
    get:
      operationId: getKpiDashboard
      tags: [kpi]
      summary: KPI dashboard summary (admin only)
      responses:
        "200":
          description: KPI metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDashboard"

  /kpi/sla-report:
    get:
      operationId: getSlaReport
      tags: [kpi]
      summary: SLA adherence report by time period (admin only)
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, quarter]
            default: month
      responses:
        "200":
          description: SLA report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaReportEntry"

  # ── Dashboard Summary (wow) ────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [kpi]
      summary: High-level dashboard counts and pipeline summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Invites ────────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResult"
  /document-requests:
    get:
      operationId: listDocumentRequests
      tags: [document-requests]
      summary: List document requests (staff sees all; clients see their own)
      responses:
        "200":
          description: List of document requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRequest"
    post:
      operationId: createDocumentRequest
      tags: [document-requests]
      summary: Create a document request for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestInput"
      responses:
        "201":
          description: Created document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /document-requests/{id}:
    patch:
      operationId: updateDocumentRequest
      tags: [document-requests]
      summary: Update document request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestUpdate"
      responses:
        "200":
          description: Updated document request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across cases, tasks, consultations, clients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grouped search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List pending invites (admin only)
      responses:
        "200":
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Generate an invite link for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── User ──────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, displayName, email, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        role:
          type: string
          enum: [admin, clerk, client]
        displayName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string

    # ── Case ──────────────────────────────────────────────────────────────
    Case:
      type: object
      required: [id, title, status, clientId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        filingRef:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
          default: open
        clientId:
          type: integer
        filingRef:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium

    CaseUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, review, closed]
        clientId:
          type: integer
        filingRef:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]

    TimelineEvent:
      type: object
      required: [id, caseId, eventType, description, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        eventType:
          type: string
        description:
          type: string
        actorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Document ──────────────────────────────────────────────────────────
    Document:
      type: object
      required: [id, caseId, name, encrypted, uploadedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        fileType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        encrypted:
          type: boolean
        storagePath:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time

    DocumentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        fileType:
          type: string
        fileSize:
          type: integer
        storagePath:
          type: string

    # ── Task ──────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, caseId, title, status, priority, deadline, createdAt, updatedAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        deadline:
          type: string
          format: date
        completedAt:
          type: ["string", "null"]
          format: date-time
        isOverdue:
          type: boolean
        hasDelayLog:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [caseId, title, deadline]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: string
        deadline:
          type: string
          format: date

    TaskCompletion:
      type: object
      properties:
        delayReason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        delayNotes:
          type: string
        proofFileName:
          type: string

    # ── Delay Log ─────────────────────────────────────────────────────────
    DelayLog:
      type: object
      required: [id, taskId, reason, submittedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: ["string", "null"]
        proofFileName:
          type: ["string", "null"]
        submittedAt:
          type: string
          format: date-time

    DelayLogInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [client_unresponsive, court_delay, document_missing, resource_unavailable, other]
        notes:
          type: string
        proofFileName:
          type: string

    # ── Consultation ──────────────────────────────────────────────────────
    Consultation:
      type: object
      required: [id, caseId, title, consentGiven, status, createdAt]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]
        transcriptPlaceholder:
          type: ["string", "null"]
        consentGiven:
          type: boolean
        status:
          type: string
          enum: [scheduled, recording, completed, cancelled]
        category:
          type: ["string", "null"]
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance, null]
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ConsultationInput:
      type: object
      required: [caseId, title, consentGiven, category]
      properties:
        caseId:
          type: integer
        title:
          type: string
          minLength: 1
        notes:
          type: string
        consentGiven:
          type: boolean
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    ConsultationUpdate:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string
        audioUrl:
          type: string
        transcriptPlaceholder:
          type: string
        status:
          type: string
          enum: [scheduled, recording, completed, cancelled]
        category:
          type: string
          enum: [legal_solution, regulatory_solution, business_consultation, procedural_compliance]
        scheduledAt:
          type: string
          format: date-time

    # ── KPI ───────────────────────────────────────────────────────────────
    KpiDashboard:
      type: object
      required: [totalCases, openCases, closedCases, totalTasks, overdueTasks, completedOnTime, slaAdherencePercent, avgTurnaroundDays]
      properties:
        totalCases:
          type: integer
        openCases:
          type: integer
        closedCases:
          type: integer
        totalTasks:
          type: integer
        overdueTasks:
          type: integer
        completedOnTime:
          type: integer
        slaAdherencePercent:
          type: number
        avgTurnaroundDays:
          type: number
        tasksByStatus:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatusCount"
        casesByPriority:
          type: array
          items:
            $ref: "#/components/schemas/CasePriorityCount"

    TaskStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    CasePriorityCount:
      type: object
      required: [priority, count]
      properties:
        priority:
          type: string
        count:
          type: integer

    SlaReportEntry:
      type: object
      required: [period, totalTasks, onTime, late, slaPercent]
      properties:
        period:
          type: string
        totalTasks:
          type: integer
        onTime:
          type: integer
        late:
          type: integer
        slaPercent:
          type: number

    DashboardSummary:
      type: object
      required: [activeCases, pendingTasks, upcomingConsultations, recentActivity]
      properties:
        activeCases:
          type: integer
        pendingTasks:
          type: integer
        upcomingConsultations:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    # ── Invite ────────────────────────────────────────────────────────────
    Invite:
      type: object
      required: [id, email, token, role, createdAt, expiresAt]
      properties:
        id:
          type: integer
        email:
          type: string
        token:
          type: string
        role:
          type: string
          enum: [admin, clerk, client]
        caseId:
          type: ["integer", "null"]
        usedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    InviteInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, clerk, client]
        caseId:
          type: integer

    # ── Notifications ───────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, userId, type, message, read, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        type:
          type: string
          enum: [reminder, document_request, general]
        message:
          type: string
        read:
          type: boolean
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MarkAllReadResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    # ── Document Requests ───────────────────────────────────────────────────
    DocumentRequest:
      type: object
      required: [id, clientId, clientClerkId, requestedBy, documentName, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientClerkId:
          type: string
        clientName:
          type: ["string", "null"]
        requestedBy:
          type: string
        documentName:
          type: string
        note:
          type: ["string", "null"]
        caseId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, fulfilled, dismissed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    DocumentRequestInput:
      type: object
      required: [clientId, documentName]
      properties:
        clientId:
          type: integer
        documentName:
          type: string
          minLength: 1
        note:
          type: string
        caseId:
          type: integer

    DocumentRequestUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, fulfilled, dismissed]

    # ── Search ──────────────────────────────────────────────────────────────
    SearchResultItem:
      type: object
      required: [id, title, subtitle]
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string

    SearchResults:
      type: object
      required: [cases, tasks, consultations, clients]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        consultations:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
