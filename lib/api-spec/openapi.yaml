openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Private Practice Management & Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Verified session context, workspace membership and access requests
  - name: users
    description: User directory
  - name: cases
    description: Case management
  - name: documents
    description: Case document vault
  - name: tasks
    description: Task pipeline and SLA
  - name: delay-logs
    description: Mandatory delay logging
  - name: notifications
    description: In-app notification centre
  - name: document-requests
    description: Advocate-to-client document requests
  - name: search
    description: Global search
  - name: consultations
    description: Consultation recorder
  - name: kpi
    description: KPI engine (admin only)
  - name: time
    description: Time logged against matters
  - name: invites
    description: Invite link generation
  - name: calendar
    description: Master calendar updates
  - name: feedback
    description: Client feedback on matters
  - name: privacy
    description: Data export and erasure requests
  - name: invoices
    description: Invoice generation (firm admin only)
  - name: cause-list
    description: Court cause lists, and the listings proposed against a chamber's matters

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/bar-registration:
    put:
      operationId: setBarRegistration
      tags: [users]
      summary: Declare bar enrolment (self-declared, not verified against a bar council)
      description: >
        Required before an admin, senior_advocate or junior_advocate reaches
        the dashboard — see `SessionClaims.profileComplete`. Callable at any
        time afterward to correct or update what was declared; there is no
        separate admin approval step, because this is self-declaration, not a
        credential check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarRegistrationInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarRegistration"
        "400":
          description: Invalid
        "401":
          description: Unauthorized

  # ── Session & workspaces ───────────────────────────────────────────────────
  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Verified session claims
      description: >
        The authoritative description of who the caller is, which workspaces they
        are an active member of, and what they may do in the active one. The
        frontend renders exclusively from this payload; it is the only source of
        UI visibility. Never derived from client state.
      responses:
        "200":
          description: Session claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized

  /session/workspace:
    post:
      operationId: switchWorkspace
      tags: [session]
      summary: Switch the active workspace
      description: >
        Verifies the caller holds an ACTIVE membership of the requested workspace
        and, only then, mints a scoped workspace token. A workspace the caller is
        not mapped to answers 403 — there is no client-side way to select one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSwitchInput"
      responses:
        "200":
          description: Scoped session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized
        "403":
          description: Not an active member of that workspace

  /workspaces:
    post:
      operationId: createWorkspace
      tags: [session]
      summary: Create a chamber and become its owner
      description: >
        Self-serve sign-up. The caller creates a brand-new, empty workspace and
        becomes its owner at the role they choose (Firm Admin or Senior
        Advocate). Ownership adds the management capabilities so a founder can
        invite their own team whatever practice title they hold — and confers
        nothing in any other workspace. This is the only role a user can choose
        for themselves, and it only ever applies to a chamber that did not exist
        a moment ago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateInput"
      responses:
        "201":
          description: Chamber created; session now scoped to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          description: Unauthorized
        "409":
          description: That chamber name is already taken
    get:
      operationId: listWorkspaces
      tags: [session]
      summary: Workspaces the caller is explicitly mapped to
      description: >
        Returns only workspaces backed by a membership row for this user. Pending
        rows are included but flagged, so the switcher can show "awaiting
        approval" without ever offering them as selectable.
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMembershipSummary"
        "401":
          description: Unauthorized

  /access-requests:
    get:
      operationId: listAccessRequests
      tags: [session]
      summary: Pending access requests for the active workspace (admin only)
      responses:
        "200":
          description: Access requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
    post:
      operationId: createAccessRequest
      tags: [session]
      summary: Request access to a workspace
      description: >
        Records intent only. The requested role is stored as `requestedRole` and
        grants nothing; the membership is created with status `pending`. Approval
        is an explicit admin action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestInput"
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "401":
          description: Unauthorized
        "409":
          description: A membership or request already exists

  /access-requests/{id}/decision:
    post:
      operationId: decideAccessRequest
      tags: [session]
      summary: Approve or deny an access request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionInput"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
        "404":
          description: Request not found in this workspace

  /calendar:
    get:
      operationId: listCalendarEntries
      tags: [calendar]
      summary: Calendar updates visible to the caller
      description: >
        Scoped twice: to the caller's workspace, and to entries whose audience
        includes their role or their user id. A client never receives a
        staff-only notice.
      responses:
        "200":
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden
    post:
      operationId: createCalendarEntry
      tags: [calendar]
      summary: Post a calendar update (Admin and Senior Advocate only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden

  /calendar/{id}:
    patch:
      operationId: updateCalendarEntry
      tags: [calendar]
      summary: Move or edit a calendar entry (Admin and Senior Advocate only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntryUpdate"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace
    delete:
      operationId: deleteCalendarEntry
      tags: [calendar]
      summary: Remove a calendar update (Admin and Senior Advocate only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace

  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: Feedback visible to the caller
      description: >
        Staff see every rating in the workspace; a client sees only their own.
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Leave feedback on one of your matters (clients only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
        "409":
          description: You have already rated this matter

  /feedback/{id}/response:
    post:
      operationId: respondToFeedback
      tags: [feedback]
      summary: Reply to a client's feedback (Admin and Senior Advocate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackResponseInput"
      responses:
        "200":
          description: Response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "403":
          description: Forbidden
        "404":
          description: Not found in this workspace

  /documents:
    get:
      operationId: listWorkspaceDocuments
      tags: [documents]
      summary: Every document the caller may see, across their matters
      description: >
        Scoped by matter visibility and, for clients, by document visibility —
        firm-internal files are never returned to a client.
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "403":
          description: Forbidden

  /workspace/audit:
    get:
      operationId: listAuditEvents
      tags: [session]
      summary: The workspace's audit log, newest first (audit.read only)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "403":
          description: Forbidden

  /workspace/usage:
    get:
      operationId: getUsage
      tags: [session]
      summary: What the workspace is using against its plan allowance
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "403":
          description: Forbidden

  /cases/conflict-check:
    post:
      operationId: checkConflicts
      tags: [cases]
      summary: Screen a proposed opposing party before opening a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictCheckInput"
      responses:
        "200":
          description: Possible conflicts, empty when clear
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConflictHit"
        "403":
          description: Forbidden

  /documents/{id}/content:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Download the stored bytes of a document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Forbidden
        "404":
          description: No such document, or no bytes stored

  /privacy/export:
    get:
      operationId: exportMyData
      tags: [privacy]
      summary: Everything this workspace holds about the caller
      responses:
        "200":
          description: Personal data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "403":
          description: Forbidden

  /privacy/erasure:
    get:
      operationId: listErasureRequests
      tags: [privacy]
      summary: Erasure requests - your own, or all of them with privacy.manage
      responses:
        "200":
          description: Erasure requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErasureRequest"
        "403":
          description: Forbidden
    post:
      operationId: requestErasure
      tags: [privacy]
      summary: Ask the chamber to erase your personal data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErasureRequestInput"
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "403":
          description: Forbidden
        "409":
          description: A request is already pending

  /privacy/erasure/{id}:
    patch:
      operationId: decideErasure
      tags: [privacy]
      summary: Complete or reject an erasure request (privacy.manage only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErasureDecisionInput"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "403":
          description: Forbidden
        "404":
          description: No such request

  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [session]
      summary: Whether online payment is available, and the public key for it
      responses:
        "200":
          description: Payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfig"

  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [session]
      summary: Create a payment order for a plan (billing.manage only)
      description: >
        Creates an order with the payment provider for an amount this server
        computed from the plan catalogue. It does NOT change the subscription:
        nothing is in force until the provider's signed webhook confirms the
        money arrived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrder"
        "400":
          description: Unknown plan, or a plan that is priced by quotation
        "403":
          description: Forbidden
        "503":
          description: Payments are not configured for this deployment

  /workspace/subscription:
    get:
      operationId: getSubscription
      tags: [session]
      summary: The workspace's current plan, alongside the full price catalogue
      responses:
        "200":
          description: Subscription and available plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionState"
        "403":
          description: Forbidden
    put:
      operationId: setSubscription
      tags: [session]
      summary: Choose a plan and billing period (billing.manage only)
      description: >
        The client sends only a plan and a billing period. Prices are resolved
        server-side from the catalogue, so no amount is ever accepted from the
        browser. This records the selection; it does not capture a payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Plan selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionState"
        "400":
          description: Unknown plan or billing period
        "403":
          description: Forbidden

  /service-enquiries:
    post:
      operationId: createServiceEnquiry
      tags: [session]
      summary: Ask about a service the pricing screen names but does not sell (billing.manage only)
      description: >
        Records the enquiry against the caller's workspace. There is no
        self-serve fulfilment behind this — it is a lead into a conversation,
        read straight from the table until an admin screen exists for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceEnquiryInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnquiryAck"
        "400":
          description: Invalid
        "403":
          description: Forbidden

  /courts:
    get:
      operationId: listCourts
      tags: [cause-list]
      summary: Courts a matter can be filed at
      description: >
        Global reference data, not workspace-scoped — a court is a fact about
        the world. Populates the court picker on a matter, which is what makes
        a matter matchable against a published cause list at all.
      responses:
        "200":
          description: Courts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Court"
        "403":
          description: Forbidden

  /cause-list/proposals:
    get:
      operationId: listCauseListProposals
      tags: [cause-list]
      summary: Listings matched to this chamber's matters, awaiting a decision
      description: >
        A proposal is never a calendar entry. Nothing published by a court
        reaches this chamber's calendar until somebody accepts it here.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, dismissed]
          description: Defaults to pending.
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CauseListProposal"
        "403":
          description: Forbidden

  /cause-list/proposals/{id}/decision:
    post:
      operationId: decideCauseListProposal
      tags: [cause-list]
      summary: Accept a listing onto the calendar, or dismiss it (calendar.write only)
      description: >
        Accepting creates the hearing entry and records which entry it created.
        Dismissing records the refusal so the next sync cannot re-propose it.
        Same capability as posting any other calendar update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CauseListDecisionInput"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauseListProposal"
        "403":
          description: Forbidden
        "404":
          description: No such proposal in this workspace
        "409":
          description: Already decided

  /cause-list/runs:
    get:
      operationId: listCauseListRuns
      tags: [cause-list]
      summary: Sync health — did each court's list actually get read? (audit.read only)
      description: >
        A scraper's usual failure is going quiet, not crashing. This is where
        "the Lucknow list has returned zero rows since the 4th" is visible.
      responses:
        "200":
          description: Recent runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CauseListSyncRun"
        "403":
          description: Forbidden

  /cause-list/sync:
    post:
      operationId: triggerCauseListSync
      tags: [cause-list]
      summary: Fetch a court's list now, rather than waiting for the schedule (audit.read only)
      description: >
        Reaches out to a third-party — usually government — server, so it is
        held to the same capability as the audit log and rate-limited hard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CauseListSyncInput"
      responses:
        "200":
          description: What the run did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauseListSyncRunResult"
        "403":
          description: Forbidden
        "404":
          description: No such court

  /workspace/access-list:
    get:
      operationId: listAccessList
      tags: [session]
      summary: Email addresses and domains admitted to this workspace (admin only)
      responses:
        "200":
          description: Access list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessListEntry"
        "403":
          description: Forbidden
    post:
      operationId: createAccessListEntry
      tags: [session]
      summary: Admit an address or domain, with the role it is granted (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessListEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessListEntry"
        "403":
          description: Forbidden
        "409":
          description: That address or domain is already on the list

  /workspace/access-list/{id}:
    delete:
      operationId: revokeAccessListEntry
      tags: [session]
      summary: Revoke an access-list entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
        "403":
          description: Forbidden
        "404":
          description: Entry not found in this workspace

  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [session]
      summary: Active members of the current workspace (admin only)
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden

  /workspace/members/{id}:
    patch:
      operationId: updateWorkspaceMember
      tags: [session]
      summary: Change a member's role or revoke them (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdateInput"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "403":
          description: Forbidden
        "404":
          description: Member not found in this workspace

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, senior_advocate, junior_advocate, clerk_intern, clerk, client]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  # ── Cases ──────────────────────────────────────────────────────────────────
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases (filtered by role)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, review, closed]
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
