<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LEX Practice</title>
    <meta
      name="description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <!--
      Not indexed, on purpose.

      Access is invite-only: every route behind /portal answers 403 to anyone
      without an active membership, so there is nothing here for a crawler to
      reach and a search result for a chamber's login page is an invitation to
      credential-stuffing rather than a customer. The landing page is the only
      public surface, and it is reached by being told about it.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="LEX Practice" />
    <meta
      property="og:description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LEX Practice" />
    <meta
      name="twitter:description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <!--
      Four icons, because one was not enough.

      The SVG alone was shipped first and the tab stayed blank on a phone.
      Safari does not support SVG favicons at all — not on macOS, not on iOS —
      and it was the only icon declared, so there was nothing for it to fall
      back to. Worse, /favicon.ico and /apple-touch-icon.png did not exist, so
      the SPA's catch-all answered both with index.html: HTML, at status 200,
      to a request for an image.

      Order matters. A browser takes the LAST declared icon it understands, so
      the SVG goes after the .ico: anything modern gets the scalable one that
      follows the system theme, and everything else falls back up the list.
      The rasters are generated from favicon.svg and carry the light pair,
      since a PNG cannot hold a media query.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      No webfont CDN on purpose.

      Loading fonts from a third party discloses every visitor's IP address to
      that third party before they have signed in, which is difficult to
      reconcile with the DPDP notice this product carries. The type stack in
      index.css is built from faces the operating system already has, so
      nothing leaves the browser and there is no render-blocking request.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e6ded2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
