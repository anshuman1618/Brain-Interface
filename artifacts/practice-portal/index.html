<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LEX Practice</title>
    <meta
      name="description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <!--
      Not indexed, on purpose.

      Access is invite-only: every route behind /portal answers 403 to anyone
      without an active membership, so there is nothing here for a crawler to
      reach and a search result for a chamber's login page is an invitation to
      credential-stuffing rather than a customer. The landing page is the only
      public surface, and it is reached by being told about it.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="LEX Practice" />
    <meta
      property="og:description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LEX Practice" />
    <meta
      name="twitter:description"
      content="Invite-only chamber management for a legal practice: matters, cause list, tasks and SLAs, time capture, invoicing, and a read-only client portal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No webfont CDN on purpose.

      Loading fonts from a third party discloses every visitor's IP address to
      that third party before they have signed in, which is difficult to
      reconcile with the DPDP notice this product carries. The type stack in
      index.css is built from faces the operating system already has, so
      nothing leaves the browser and there is no render-blocking request.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e6ded2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
